<!DOCTYPE html>

<head>
  <!-- head：这份文件的说明、设置和所需资源 -->
  <!-- 是网页交给浏览器看的设置区 -->

  <meta charset="UTF-8">
  <!-- 这个 HTML 文件的文字采用 UTF-8 编码。
   UTF-8 可以表示中文、英文和许多其他语言的字符。
   通常把它放在 <head> 的前面，让浏览器尽早知道该用什么方式读取文字；
   如果编码不匹配，中文可能会显示成乱码。 -->

  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- viewport:让网页在手机等不同宽度的屏幕上正确显示。 -->

  <title>Server Hunting</title>
  <!-- 网页标题，常显示在浏览器标签页上。 -->

  <link rel="stylesheet" href="style.css" />
  <!-- 上面这行很特别，写了html的文件才能关联到左边style.css文件 -->
</head>
